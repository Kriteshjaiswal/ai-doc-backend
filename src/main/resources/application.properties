# ========================
# Application
# ========================
spring.application.name=document-service
server.port=9090

# ========================
# Netflix Eureka Client
# ========================
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}:${random.value}

# ========================
# ========================
# Database Configuration (PostgreSQL by default, MySQL compatible)
# ========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/aidoc_qa_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.postgresql.Driver}

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ========================
# Virtual Threads & Concurrency
# ========================
spring.threads.virtual.enabled=true
server.tomcat.threads.max=250
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100

# ========================
# HikariCP Connection Pool
# ========================
spring.datasource.hikari.maximum-pool-size=40
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=30000

# ========================
# HTTP Gzip Compression
# ========================
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# ========================
# File Upload
# ========================
file.upload-dir=./uploads
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# ========================
# Google Gemini API
# ========================
gemini.api.key=${GEMINI_API_KEY}
gemini.primary.model=${GEMINI_MODEL}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent

# AI Model Dynamic Fallback:
# 1. initial-seconds (25s): if model does not start streaming in 25s, auto-shift immediately
# 2. read-seconds (60s): once reading begins, lock onto model and allow full streaming headroom
ai.model.timeout.initial-seconds=${AI_MODEL_INITIAL_TIMEOUT:25}
ai.model.timeout.connect-seconds=${AI_MODEL_CONNECT_TIMEOUT:5}
ai.model.timeout.read-seconds=${AI_MODEL_READ_TIMEOUT:60}
ai.http.version=${AI_HTTP_VERSION:HTTP_1_1}

# ========================
# Swagger / OpenAPI
# ========================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# ========================
# CORS Configuration
# ========================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ========================
# JWT Configuration
# ========================
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ========================
# Actuator
# ========================
management.endpoints.web.exposure.include=health,info
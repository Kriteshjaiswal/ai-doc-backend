version: "3.9"

services:
  # ==========================================
  # MySQL Database Container
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: aidocqa-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aidocqa}
      MYSQL_USER: ${MYSQL_USER:-aidocuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aidocpassword}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - aidocqa-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ==========================================
  # Spring Boot Backend API
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aidocqa-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: ${MYSQL_HOST:-mysql}
      MYSQL_PORT: ${MYSQL_PORT:-3306}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aidocqa}
      MYSQL_USER: ${MYSQL_USER:-aidocuser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-aidocpassword}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*,http://*:*,https://*}
      JWT_SECRET: ${JWT_SECRET:-dGhpcyBpcyBhIHNlY3VyZSBqd3Qgc2VjcmV0IGtleSBmb3IgYWlkb2NxYSBhcHBsaWNhdGlvbiEh}
    ports:
      - "${BACKEND_PORT:-9090}:8080"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - aidocqa-network

volumes:
  mysql_data:
  uploads_data:

networks:
  aidocqa-network:
    driver: bridge

